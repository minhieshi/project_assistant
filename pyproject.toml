[project]
name = "local-project-assistant"
version = "0.8.1"
description = "Local-first read-only project intelligence with authenticated Next.js/FastAPI UI, iterative multi-repo RAG, knowledge graph, live source retrieval and OpenCode handoff"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "langchain-chroma>=0.2.0",
  "langchain-core>=0.3.0",
  "portkey-ai==2.3.4",
  "pymupdf>=1.24.0",
]

[project.scripts]
project-assistant = "project_assistant.cli:main"
project-assistant-api = "project_assistant.api_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
